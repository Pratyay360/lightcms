# This is a GitHub App Manifest. These settings will be used by default when
# initially configuring your GitHub App.
#
# NOTE: changing this file will not update your GitHub App settings.
# You must visit github.com/settings/apps/your-app-name to edit them.
#
# Read more about configuring your GitHub App:
# https://probot.github.io/docs/development/#configuring-a-github-app
#
# Read more about GitHub App Manifests:
# https://developer.github.com/apps/building-github-apps/creating-github-apps-from-a-manifest/

# The list of events the GitHub App subscribes to.
# Uncomment the event names below to enable them.
default_events:
  - pull_request
  - push

# The set of permissions needed by the GitHub App. The format of the object uses
# the permission name for the key (for example, issues) and the access type for
# the value (for example, write).
# Valid values are `read`, `write`, and `none`
default_permissions:
  contents: write
  issues: write
  metadata: read
  pull_requests: read
  statuses: write
# The name of the GitHub App. Defaults to the name specified in package.json
name: lightcms

# The homepage of your GitHub App.
url: https://lightcms.me

# Webhook URL — must point to the deployed SvelteKit app so probot can
# receive push, pull_request, and installation events. Set this in the
# GitHub App settings (app.yml is the manifest; the webhook URL is not
# part of the manifest schema).
#   Production: https://lightcms.me/api/github/webhook

# GitHub redirects here after installation so LightCMS can associate the
# installation with the authenticated CMS user.
setup_url: https://lightcms.me/github/setup
setup_on_update: false

description: A small bot to manage content for static sites on behalf of lightcms
public: true
